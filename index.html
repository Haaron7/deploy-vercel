<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绚丽的鹦鹉世界 - 鹦鹉主题图库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%);
            color: white;
            text-align: center;
            padding: 3rem 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        main {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 1.5rem;
            flex: 1;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .card-content {
            padding: 1.5rem;
        }

        .card-content h3 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            color: #2c3e50;
        }

        .card-content p {
            font-size: 0.95rem;
            color: #666;
            line-height: 1.5;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background: #2c3e50;
            color: white;
            font-size: 0.9rem;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>🦜 绚丽的鹦鹉世界</h1>
        <p>探索大自然中最聪明的色彩精灵</p>
    </header>

    <main>
        <div class="gallery">
            <!-- 卡片 1 -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1552728089-57bdde30beb3?auto=format&fit=crop&w=800&q=80" alt="金刚鹦鹉">
                <div class="card-content">
                    <h3>五彩金刚鹦鹉</h3>
                    <p>羽毛色彩斑斓，性格活泼聪明，是热带雨林中最具代表性的美丽鸟类之一。</p>
                </div>
            </div>

            <!-- 卡片 2 -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1578328819058-b69f3a3b0f6b?auto=format&fit=crop&w=800&q=80" alt="彩色鹦鹉">
                <div class="card-content">
                    <h3>彩虹吸蜜鹦鹉</h3>
                    <p>拥有令人惊叹的渐变色彩，喜欢吸食花蜜和花粉，身手异常敏捷。</p>
                </div>
            </div>

            <!-- 卡片 3 -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1545671913-b89ac1b4ac10?auto=format&fit=crop&w=800&q=80" alt="可爱小鹦鹉">
                <div class="card-content">
                    <h3>热带小鹦鹉</h3>
                    <p>体型小巧可爱，善于社交，拥有极强的模仿人类语言和声音的天赋。</p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 鹦鹉图库网页. 保留所有权利.</p>
    </footer>

</body>
</html>
